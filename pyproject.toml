[build-system]
requires = ["setuptools>=77"]   # PEP 639 SPDX license strings (item 27)
build-backend = "setuptools.build_meta"

[project]
name = "iamf-sentinel-pro"
version = "0.3.5"
description = "Pro plugin for iamf-sentinel: L3 rendered QC (decoder oracles + BS.1770-4), ADM source-referenced fidelity QC, platform profile packs"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["iamf", "immersive-audio", "loudness", "bs1770", "adm", "qc"]
# A′ (doc 48): the whole stack is Apache-2.0; the seam is architecture, not a license boundary
license = "Apache-2.0"                     # PEP 639 SPDX string (item 27)
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The iamf-sentinel authors" }]
# numpy moved to an extra by the ADR-6b backend switch (doc 35): a kernel-backed
# install (sentinel-dsp binary on $PATH) runs `validate --l3` with no scientific
# stack. The [numpy] extra restores the Python reference backend, adm-compare,
# and diff --render.
# The floor is 0.4.0 (moved from 0.3.3 with Pro 0.3.5), and it is LOAD-BEARING:
# Pro resolves check definitions out of the installed core's registry
# (sentinel.findings.spec, a bare REGISTRY[id]), so the core it runs beside
# decides what those definitions say. History: the S-340..S-346 rows used by
# intent_compare first ship in core 0.3.3; against core 0.3.2 every S-34x lookup
# raises KeyError — measured, with a positive control on a pre-existing check
# (doc 127).
dependencies = ["iamf-sentinel>=0.4.0"]

[project.urls]
Homepage        = "https://github.com/jlivingston-Cipher/iamf-sentinel-pro"
Repository      = "https://github.com/jlivingston-Cipher/iamf-sentinel-pro"
Issues          = "https://github.com/jlivingston-Cipher/iamf-sentinel-pro/issues"
"IAMF Sentinel" = "https://github.com/jlivingston-Cipher/iamf-sentinel"

[project.optional-dependencies]
# scipy: adm-compare's alignment cross-correlation (doc 31). Anything that
# imports adm_compare or diff --render needs this extra.
numpy = ["numpy>=1.24", "scipy>=1.10"]
test = ["pytest>=7", "numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["sentinel_pro"]
include-package-data = true

[tool.setuptools.package-data]
sentinel_pro = ["profiles/*.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint with ruff defaults (E4/E7/E9/F). The fixture/dev tier deliberately uses a
# compact one-line idiom; the per-file ignores below codify that two-tier style.
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"sentinel-dsp/tests/differential.py" = ["E702"]  # compact vector-builder tier
"tests/test_adm_compare.py" = ["E402"]           # imports follow importorskip

