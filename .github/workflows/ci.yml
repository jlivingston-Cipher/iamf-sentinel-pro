# iamf-sentinel-pro CI — 3-OS × 2-Python matrix (doc 88 Tier B, item 24, doc 97).
#
# Companion to `dsp-differential.yml`, which is a different claim: that job
# builds the C++ kernel and gates it against dsp.py on ubuntu only. This one
# says the *Python* side of Pro runs on three platforms. Neither implies the
# other, and README.md must not blur them.
#
# Why two checkouts. The suite's fixture builders (`fixtures/build.py`,
# `fixtures/mp4wrap.py`) ship in the iamf-sentinel SOURCE tree, not in the
# installed wheel, and two modules here build real IAMF bytes with them. The
# sibling checkout supplies them; `tests/conftest.py` finds it by name
# (`iamf-sentinel/`, `sentinel-oss/`, or `$IAMF_SENTINEL_SRC`) and skips those
# two modules cleanly when none is present. Note the side effect, which is
# intentional: the source checkout precedes the installed wheel on sys.path,
# so this matrix exercises Pro against the core's current `main` — an
# early-warning signal, not a released-wheel compatibility test.
#
# Provenance note (doc 97 §4). The Linux leg below was executed verbatim in
# the doc-97 session: 58 passed / 15 skipped / 0 failed in the two-checkout
# layout, byte-for-byte the invocation in this file. The macOS and Windows
# legs were NOT authored blind: a Windows exec-semantics simulation
# (`#!/bin/sh` stubs raising WinError 193) isolated exactly three tests that
# would have failed there, plus one `shutil.which()`/`%PATHEXT%` discovery
# test; all four now carry skip markers, and the remaining suite was measured
# green under that simulation (54 passed / 15 skipped / 0 failed). macOS
# carries no simulated evidence — it is POSIX and the risk was judged low.
#
# Claims discipline (item 23): no OS is named in README.md until its leg here
# is green. Removing an OS from this matrix means removing it from that
# sentence in the same commit.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: iamf-sentinel-pro
      # The core's SOURCE tree — supplies fixtures/ (not shipped in the wheel).
      - uses: actions/checkout@v4
        with:
          repository: jlivingston-Cipher/iamf-sentinel
          path: iamf-sentinel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # IA-0078: just after a core upload the package index can take minutes to
      # show the new version to every runner (2026-10-02: 3 of 7 legs could not
      # see it; a re-run two minutes later passed 7/7). Retry with back-off,
      # about ten minutes in all, before calling the install a failure; a real
      # resolution error therefore takes that long to fail.
      - name: Install (retries while a just-uploaded dependency reaches the index)
        shell: bash
        run: |
          for wait in 0 30 60 90 120 150 180; do
            sleep "$wait"
            python -m pip install --no-cache-dir -e ".[test]" && exit 0
            echo "::warning::install failed; retrying in case the index has not caught up"
          done
          exit 1
        working-directory: iamf-sentinel-pro
      # Oracle-gated, sample-gated, kernel-gated and (on Windows) POSIX-stub
      # tests skip cleanly in this environment; zero failures is the gate.
      # Item 29 (doc 108): CPython's own detector for the doc-98 locale-encoding
      # class — any default-encoding read/write/subprocess-decode fails the leg.
      # doc 128: the sibling checkout above is now LOAD-BEARING, not assumed.
      # Without it tests/test_l3_layout_units.py and
      # tests/test_oracle_units.py skip at MODULE level, 17 tests are never
      # collected, and the suite still exits 0 — a green leg that ran a
      # third of these units. This flag makes that state a hard error.
      - run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests -q
        working-directory: iamf-sentinel-pro
        env:
          IAMF_SENTINEL_REQUIRE_FULL_COLLECTION: "1"
